<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAROQUE TV</title>
<style>
  :root { --bg:#0e0b1a; --card:#1b1630; --fg:#f4f1ff; --mut:#9a93b8; --acc:#ff3d8b; --ok:#3ddc84; --warn:#ffb020; --bad:#e0245e; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse at top,#2a1650,var(--bg) 70%); color:var(--fg); font-family:-apple-system,system-ui,"Segoe UI",sans-serif; }
  /* a USB song plays under this page (Tizen app): only the bottom strip is drawn */
  body.clear { background:transparent; }
  body.clear .screen, body.clear .corner { display:none !important; }
  .hidden { display:none !important; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4vh 5vw; text-align:center; }
  .logo { font-size:4.5vw; font-weight:900; letter-spacing:.3vw; }
  .logo span { color:var(--acc); }
  .mut { color:var(--mut); }
  /* lobby */
  #lobby { flex-direction:row; gap:6vw; }
  #lobby .left { flex:1; }
  .qr { background:#fff; padding:1.2vw; border-radius:1.5vw; line-height:0; display:inline-block; }
  .qr svg { width:26vw; height:26vw; }
  .room { font-size:2vw; margin-top:1.5vh; }
  .room b { letter-spacing:.4vw; color:var(--warn); }
  .chips { display:flex; flex-wrap:wrap; gap:1vw; justify-content:center; margin-top:3vh; }
  .chip { background:var(--card); border-radius:3vw; padding:1vh 2vw; font-size:2.2vw; }
  .chip.turn { outline:.3vw solid var(--warn); }
  .rules { font-size:1.7vw; line-height:1.6; margin-top:3vh; color:#d8d2f0; }
  /* question */
  #qHead { font-size:2.2vw; color:var(--mut); }
  #qText { font-size:3.6vw; font-weight:800; margin:3vh 0 4vh; max-width:85vw; line-height:1.3; }
  #qAns { display:grid; grid-template-columns:1fr 1fr; gap:2vh 2vw; width:85vw; }
  .ans { background:var(--card); border-radius:2vw; padding:2.5vh 2vw; font-size:2.6vw; border:.4vw solid transparent; }
  .ans b { color:var(--warn); margin-left:1vw; }
  .ans.good { background:#16452c; border-color:var(--ok); }
  .ans.bad { background:#4a1630; border-color:var(--bad); }
  #qTimer { font-size:5vw; font-weight:900; margin-top:3vh; }
  #qTimer.low { color:var(--bad); }
  #verdict { font-size:4vw; font-weight:900; margin-top:3vh; min-height:6vh; }
  /* song */
  #singer { font-size:4vw; font-weight:800; margin-bottom:3vh; }
  .bar { position:relative; width:80vw; height:9vh; background:#2a2445; border-radius:5vh; overflow:hidden; }
  .bM, .bA { position:absolute; top:0; bottom:0; transition:width .4s, right .4s; }
  .bM { right:0; width:0; background:linear-gradient(270deg,var(--acc),var(--warn)); }
  .bA.pos { background:repeating-linear-gradient(45deg,#3ddc84,#3ddc84 14px,#2bb36a 14px,#2bb36a 28px); }
  .bA.neg { background:repeating-linear-gradient(45deg,#e0245e,#e0245e 14px,#a8173f 14px,#a8173f 28px); opacity:.85; }
  .b80 { position:absolute; top:-1vh; bottom:-1vh; right:80%; width:.4vw; background:#fff; }
  #num { font-size:9vw; font-weight:900; margin-top:2vh; }
  #votes { font-size:3vw; margin-top:1vh; }
  #songStatus { font-size:2.4vw; margin-top:2vh; color:var(--mut); }
  /* narrow side panel over a playing video (the lyrics stay free) */
  #strip { position:absolute; left:1.2vw; top:10vh; bottom:10vh; width:7vw; background:rgba(14,11,26,.75); border-radius:1.5vw;
           padding:1.5vh .5vw; display:flex; flex-direction:column; align-items:center; gap:1.2vh; font-size:1.3vw; text-align:center; }
  .vbar { position:relative; flex:1; width:3vw; background:#2a2445; border-radius:1.5vw; overflow:hidden; }
  .vM, .vA { position:absolute; left:0; right:0; transition:height .4s, bottom .4s; }
  .vM { bottom:0; height:0; background:linear-gradient(0deg,var(--acc),var(--warn)); }
  .vA.pos { background:repeating-linear-gradient(45deg,#3ddc84,#3ddc84 8px,#2bb36a 8px,#2bb36a 16px); }
  .vA.neg { background:repeating-linear-gradient(45deg,#e0245e,#e0245e 8px,#a8173f 8px,#a8173f 16px); opacity:.85; }
  .v80 { position:absolute; left:-.5vw; right:-.5vw; bottom:80%; height:.5vh; background:#fff; }
  #sNum { font-size:2.8vw; font-weight:900; }
  #sName, #sVotes { white-space:pre-line; }
  body.clear #mini { display:none; }
  /* result + scores */
  #rScore { font-size:16vw; font-weight:900; line-height:1; }
  #rVerdict { font-size:4vw; margin-top:2vh; }
  #rSplit { font-size:2vw; margin-top:2vh; }
  #board { font-size:2.6vw; width:60vw; margin-top:3vh; }
  #board .row { display:flex; justify-content:space-between; padding:1vh 2vw; border-bottom:1px solid #2a2445; }
  #titles { font-size:2.6vw; margin-top:3vh; line-height:1.6; }
  .corner { position:absolute; bottom:3vh; left:3vw; text-align:center; font-size:1.2vw; color:var(--mut); }
  .corner .qr { padding:.5vw; border-radius:.8vw; }
  .corner .qr svg { width:9vw; height:9vw; }
  #mini { position:absolute; top:2vh; right:3vw; font-size:1.6vw; color:var(--mut); }
  #wheelCap { font-size:3.4vw; font-weight:900; color:#fde68a; margin-bottom:2vh; min-height:5vh; text-shadow:0 .6vh 2.4vh rgba(0,0,0,.7); }
  #wheel { width:72vh; height:72vh; }
  #kqv { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; background:#000; display:none; }
  #kqv.on { display:block; }
  .screen, #strip, #mini, .corner, #conn { z-index:5; }
  #conn { position:absolute; top:2vh; left:2vw; font-size:1.4vw; color:var(--mut); }
</style>
</head>
<body>
<video id="kqv" playsinline></video>
<div id="conn">מתחבר…</div>

<div class="screen" id="lobby">
  <div class="left">
    <div class="logo">🎤 KARO<span>QUE</span></div>
    <div class="rules">כל אחד בתורו עונה על שאלה בטלפון.<br>נכון: +1. טעות או שתיקה: −1, ושרים שיר!<br>שיר עם ציון 80 ומעלה מציל את הנקודה. הקהל מצביע 👍 / 👎.</div>
    <div class="chips" id="chips"></div>
    <div class="mut" id="adminLine" style="font-size:1.8vw;margin-top:2vh"></div>
  </div>
  <div>
    <div class="qr" id="qrBig"></div>
    <div class="room">סרקו במצלמה כדי להצטרף · חדר <b class="roomCode"></b></div>
  </div>
</div>

<div class="screen hidden" id="question">
  <div id="qHead"></div>
  <div id="qText"></div>
  <div id="qAns"></div>
  <div id="qTimer"></div>
  <div id="verdict"></div>
</div>

<div class="screen hidden" id="wheelScr">
  <div id="wheelCap"></div>
  <canvas id="wheel" width="800" height="800"></canvas>
</div>

<div class="screen hidden" id="song">
  <div id="singer"></div>
  <div class="bar"><div class="bM"></div><div class="bA"></div><div class="b80"></div></div>
  <div id="num">0</div>
  <div id="votes"></div>
  <div id="songStatus"></div>
</div>

<div class="screen hidden" id="result">
  <div style="font-size:3.5vw" id="rName"></div>
  <div id="rScore"></div>
  <div id="rVerdict"></div>
  <div class="mut" id="rSplit"></div>
</div>

<div class="screen hidden" id="closing">
  <div class="logo">🎶 שיר סיום</div>
  <div style="font-size:3vw;margin-top:3vh">כולם שרים ביחד!</div>
</div>

<div class="screen hidden" id="scores">
  <div class="logo">🏆 טבלת ניקוד</div>
  <div id="board"></div>
  <div id="titles"></div>
</div>

<div id="strip" class="hidden">
  <div id="sName"></div>
  <div class="vbar"><div class="vM"></div><div class="vA"></div><div class="v80"></div></div>
  <div id="sNum"></div>
  <div id="sVotes"></div>
</div>

<div id="mini"></div>
<div class="corner hidden" id="corner"><div class="qr" id="qrSmall"></div><div>להצטרפות · <b class="roomCode"></b></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';
/* The TV is the game's authority: it owns the state, picks the admin, runs the
   admin's commands, asks the questions, judges the answers and the songs.
   Inside the Tizen app it asks the app (window.parent) to play USB songs. */
const SB_URL = 'https://vifemcedezouvuayplun.supabase.co';
const SB_KEY = 'sb_publishable_QN23d4WZsTSTAsiB-lWCDQ_9Y1DBFdT';
const PASS = 80, METER_W = 0.79, ANSWER_S = 30, REVEAL_MS = 3500, RESULT_MS = 8000;
const ADMIN_GRACE_MS = 60000, STOP_GRACE_MS = 4000, FREE_RESULT_MS = 15000;
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);
const ls = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* no storage */ } }
};

function newCode() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let r = '';
  for (let i = 0; i < 5; i++) r += A[Math.floor(Math.random() * A.length)];
  return r;
}

const room = ls.get('kq_tv_room') || newCode();
ls.set('kq_tv_room', room);
const base = new URL('.', document.baseURI).href;
const joinUrl = base + 'game.html?r=' + room;

let sb = null, chan = null, players = [], adminGoneAt = 0, timer = 0, tick = 0;
let game = {
  phase: 'lobby', admin: ls.get('kq_tv_admin'), song: 0, singer: '', singerName: '', dur: 0, result: null,
  on: false, order: [], names: {}, scores: {}, best: {}, turnNo: 0, turns: 15, cut: 90,
  q: null, reveal: null, songTitle: '', penalty: false
};
let live = {}, correctIdx = -1, bank = [], qNo = 0;
let usb = [], usedSongs = new Set(), videoOn = false;
/* inside the Samsung app this page runs in the app itself (TVs do not draw iframes):
   it reads the USB drive and plays the songs on its own <video>. */
const inApp = !!(window.tizen && window.tizen.filesystem);
const hasBridge = !inApp && window.parent !== window;
let lastClear = false, lastUsbCount = -1, adminUsed = false;

function send(event, payload) {
  if (chan) chan.send({ type: 'broadcast', event, payload });
}

function set(patch) {
  game = { ...game, ...patch };
  ls.set('kq_tv_admin', game.admin || '');
  send('game', game);
  render();
}

/* numbers inside Hebrew text: keep the sign on the left ("-1", "+17") */
const ltr = x => '\u2066' + x + '\u2069';
const signed = n => ltr((n > 0 ? '+' : '') + n);

function later(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }

/* ---------- USB songs through the Tizen app ---------- */
function toApp(msg) { if (hasBridge) window.parent.postMessage(msg, '*'); }

window.addEventListener('message', e => {
  if (e.source !== window.parent || !e.data || !e.data.kq) return;
  const m = e.data;
  if (m.kq === 'songs') { usb = Array.isArray(m.songs) ? m.songs : []; render(); }
  else if (m.kq === 'ended') { videoOn = false; onVideoEnded(); }
});

const USB_DIR = 'Karoke 40/Karoke songs', VIDEO_RE = /\.(mp4|m4v|mov|mkv|webm|avi)$/i;

/* TEMPORARY: status lines to the developer's diagnostics channel (Samsung app only) */
function diag(m) {
  if (!inApp) return;
  try {
    fetch(SB_URL + '/realtime/v1/api/broadcast', { method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ topic: 'karoque-diag', event: 'log', payload: { m: 'tv: ' + String(m).slice(0, 300) } }] }) });
  } catch (e) { /* best effort */ }
}
window.addEventListener('error', e => diag('ERR ' + e.message + ' @' + e.lineno));

function usbScan() {
  try {
    tizen.filesystem.listStorages(list => {
      const st = list.filter(x => x.type === 'EXTERNAL' && x.state === 'MOUNTED')[0];
      if (!st) { diag('usb: no drive (' + list.length + ' storages)'); usb = []; render(); return; }
      tizen.filesystem.resolve(st.label, root => {
        let dir;
        try { dir = root.resolve(USB_DIR); } catch (e) { diag('usb: no folder ' + e.message); usb = []; render(); return; }
        dir.listFiles(files => {
          usb = files.filter(f => f.isFile && VIDEO_RE.test(f.name)).map(f => ({
            id: f.toURI(), uri: f.toURI(),
            title: f.name.replace(/\.[^.]+$/, '').replace(/\s*\[[^\]]*\]\s*$/, '').trim() || f.name
          }));
          if (usb.length !== lastUsbCount) { lastUsbCount = usb.length; diag('usb songs ' + usb.length + ', questions ' + bank.length); }
          render();
        }, e => diag('usb list error ' + e.message));
      }, e => diag('usb resolve error ' + e.message), 'r');
    }, e => diag('usb storages error ' + e.message));
  } catch (e) { diag('usb exception ' + e.message); }
}

function playSong(s) {
  if (!s) return;
  videoOn = true;
  if (inApp) {
    const v = $('kqv');
    v.src = s.uri; v.className = 'on';
    const r = v.play();
    if (r && r.catch) r.catch(() => { videoOn = false; v.className = ''; onVideoEnded(); });
  } else {
    toApp({ kq: 'play', id: s.id });
  }
}

function stopVideo() {
  if (inApp) {
    const v = $('kqv');
    try { v.pause(); } catch (e) { /* not playing */ }
    v.removeAttribute('src'); v.className = '';
  } else if (videoOn) {
    toApp({ kq: 'stop' });
  }
  videoOn = false;
}

function pickSong() {
  if (!usb.length) return null;
  let pool = usb.filter(s => !usedSongs.has(s.id));
  if (!pool.length) { usedSongs.clear(); pool = usb; }
  const s = pool[Math.floor(Math.random() * pool.length)];
  usedSongs.add(s.id);
  return s;
}

/* ---------- questions (AI-made bank, no repeats per box) ---------- */
function loadBank() {
  fetch(base + 'questions.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(j => { bank = (j.questions || []).filter(q => q && q.q && q.a && q.a.length === 4); })
    .catch(() => { bank = []; });
}

function pickQuestion() {
  if (!bank.length) return null;
  let seen = [];
  try { seen = JSON.parse(ls.get('kq_seen') || '[]'); } catch (e) { seen = []; }
  let pool = bank.filter(q => seen.indexOf(q.id) < 0);
  if (!pool.length) { seen = []; pool = bank; }
  const q = pool[Math.floor(Math.random() * pool.length)];
  seen.push(q.id);
  ls.set('kq_seen', JSON.stringify(seen.slice(-2000)));
  return q;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- game flow ---------- */
function present(id) { return players.some(p => p.id === id); }
function nameOf(id) { return (players.find(p => p.id === id) || {}).name || game.names[id] || ''; }

function startGame(turns, cut, secs) {
  const order = players.slice().sort((x, y) => x.at - y.at).map(p => p.id);
  if (!order.length) return;
  const names = {};
  players.forEach(p => { names[p.id] = p.name; });
  const scores = {};
  order.forEach(id => { scores[id] = 0; });
  usedSongs.clear();
  game = { ...game, on: true, order, names, scores, best: {}, turnNo: 0, ptr: 0, pending: [], rejected: [],
    turns: turns || 15, cut: cut || 0,
    secs: [10, 15, 20, 30].indexOf(secs) >= 0 ? secs : ANSWER_S };
  nextTurn();
}

function nextTurn() {
  if (!game.on) return;
  if (game.turnNo >= game.turns) { closing(); return; }
  /* the next player in order who is still here */
  const len = game.order.length;
  for (let k = 0; k < len; k++) {
    const i = ((game.ptr || 0) + k) % len, id = game.order[i];
    if (present(id)) { game.ptr = (i + 1) % len; ask(id); return; }
  }
  set({ on: false, phase: 'lobby' });          /* everyone left */
}

function ask(pid) {
  const src = pickQuestion();
  if (!src) { set({ phase: 'lobby', on: false }); $('conn').textContent = 'אין שאלות (questions.json)'; return; }
  const answers = shuffle(src.a.map((t, i) => ({ t, ok: i === 0 })));
  correctIdx = answers.findIndex(x => x.ok);
  qNo++;
  set({ phase: 'question', reveal: null,
    q: { n: qNo, text: src.q, answers: answers.map(x => x.t), left: game.secs || ANSWER_S, by: pid, byName: nameOf(pid) } });
  clearInterval(tick);
  tick = setInterval(() => {
    if (game.phase !== 'question') { clearInterval(tick); return; }
    const left = game.q.left - 1;
    if (left <= 0) { clearInterval(tick); judge(-1); return; }
    game.q.left = left;
    if (left % 5 === 0) send('game', game);   /* phones run their own countdown */
    render();
  }, 1000);
}

function judge(idx) {
  if (game.phase !== 'question') return;
  clearInterval(tick);
  const pid = game.q.by, ok = idx === correctIdx;
  const scores = { ...game.scores, [pid]: (game.scores[pid] || 0) + (ok ? 1 : -1) };
  set({ phase: 'reveal', scores, reveal: { chosen: idx, correct: correctIdx, ok } });
  later(() => { if (ok) { set({ turnNo: game.turnNo + 1 }); nextTurn(); } else penalty(pid); }, REVEAL_MS);
}

function penalty(pid) {
  const s = pickSong();
  if (!s) { startSong(pid, null); return; }
  /* the wheel of fortune draws the song, then it plays */
  set({ phase: 'wheel', singer: pid, singerName: nameOf(pid), songTitle: '' });
  spinWheel(s.title, () => {
    set({ songTitle: s.title });
    later(() => startSong(pid, s), WHEEL_SHOW_MS);
  });
}

function startSong(pid, s) {
  stopWheel();
  live = {};
  playSong(s);                                  /* before set(): the first render is already clear */
  set({ phase: 'song', song: game.song + 1, singer: pid, singerName: nameOf(pid), dur: 0, result: null,
    songTitle: s ? s.title : '', penalty: true });
  if (game.cut) later(endSong, game.cut * 1000 + 6000);   /* + calibration and countdown */
}

/* ---------- wheel of fortune ---------- */
const WHEEL_SPIN_MS = 1500, WHEEL_LAND_MS = 4500, WHEEL_SHOW_MS = 1800, WHEEL_SEGMENTS = 10;
const WHEEL_COLORS = ['#7c3aed', '#db2777', '#f59e0b', '#059669', '#2563eb', '#dc2626', '#0891b2', '#9333ea', '#ea580c', '#16a34a'];
let wheel = null, actx = null;

function tickSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 1400; g.gain.value = 0.08;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.05);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.05);
  } catch (e) { /* no sound */ }
}

function shortTitle(t) { t = String(t || ''); return t.length > 18 ? t.slice(0, 17) + '…' : t; }

function wheelTitles(chosen) {
  const pool = shuffle(usb.map(x => x.title).filter(t => t !== chosen)).slice(0, WHEEL_SEGMENTS - 1);
  pool.push(chosen);
  let titles = [];
  while (titles.length < 8) titles = titles.concat(pool);
  return shuffle(titles.slice(0, Math.max(8, pool.length)));
}

function drawWheel() {
  const c = $('wheel'), g = c.getContext('2d');
  const n = wheel.titles.length, seg = 2 * Math.PI / n, r = 380, cx = 400, cy = 400;
  g.clearRect(0, 0, 800, 800);
  g.save(); g.translate(cx, cy); g.rotate(wheel.angle);
  for (let i = 0; i < n; i++) {
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, i * seg, (i + 1) * seg); g.closePath();
    g.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length]; g.fill();
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 3; g.stroke();
    g.save(); g.rotate((i + 0.5) * seg);
    g.fillStyle = '#fff'; g.font = 'bold 27px Arial'; g.textBaseline = 'middle'; g.direction = 'rtl';
    /* keep the titles upright on the left half of the wheel */
    if (Math.cos(wheel.angle + (i + 0.5) * seg) < 0) {
      g.rotate(Math.PI); g.textAlign = 'left'; g.fillText(shortTitle(wheel.titles[i]), -(r - 24), 0);
    } else {
      g.textAlign = 'right'; g.fillText(shortTitle(wheel.titles[i]), r - 24, 0);
    }
    g.restore();
  }
  g.restore();
  g.beginPath(); g.arc(cx, cy, 46, 0, 2 * Math.PI);
  g.fillStyle = '#1e1b4b'; g.fill(); g.lineWidth = 6; g.strokeStyle = '#fde68a'; g.stroke();
  g.font = '44px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🎤', cx, cy + 2);
  g.beginPath(); g.moveTo(cx - 30, 0); g.lineTo(cx + 30, 0); g.lineTo(cx, 60); g.closePath();
  g.fillStyle = '#fde68a'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#7c2d12'; g.stroke();
}

function wheelIndexAtPointer() {
  const n = wheel.titles.length, seg = 2 * Math.PI / n;
  const a = ((-Math.PI / 2 - wheel.angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(a / seg);
}

/* spin freely, then ease out onto `title` (top pointer) */
function spinWheel(title, done) {
  stopWheel();
  wheel = { titles: wheelTitles(title), angle: Math.random() * 6.28, speed: 0.18, landing: null, last: -1, t0: Date.now() };
  const frame = () => {
    if (!wheel) return;
    if (!wheel.landing && Date.now() - wheel.t0 > WHEEL_SPIN_MS) {
      const n = wheel.titles.length, seg = 2 * Math.PI / n, idx = wheel.titles.indexOf(title);
      let to = -Math.PI / 2 - (idx + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6;
      while (to < wheel.angle + 3 * 2 * Math.PI) to += 2 * Math.PI;
      wheel.landing = { from: wheel.angle, to, t0: Date.now() };
    }
    if (wheel.landing) {
      const L = wheel.landing, k = Math.min(1, (Date.now() - L.t0) / WHEEL_LAND_MS);
      wheel.angle = L.from + (L.to - L.from) * (1 - Math.pow(1 - k, 3));
      if (k >= 1) { drawWheel(); wheel.frame = 0; done(); return; }
    } else {
      wheel.angle += wheel.speed;
    }
    const idx = wheelIndexAtPointer();
    if (idx !== wheel.last) { wheel.last = idx; tickSound(); }
    drawWheel();
    wheel.frame = requestAnimationFrame(frame);
  };
  frame();
}

function stopWheel() {
  if (wheel && wheel.frame) cancelAnimationFrame(wheel.frame);
  wheel = null;
}

function endSong() {
  if (game.phase !== 'song') return;
  stopVideo();
  const song = game.song;
  send('stop', { song });
  /* no result from the singer's phone: the point is not saved */
  later(() => { if (game.phase === 'song' && game.song === song) onResult({ song, result: null }); }, STOP_GRACE_MS);
}

function onVideoEnded() {
  if (game.phase === 'song') endSong();
  else if (game.phase === 'closing') showScores();
}

function onResult(p) {
  if (!p || p.song !== game.song || game.phase !== 'song') return;
  stopVideo();
  const r = p.result, pid = game.singer;
  const patch = { phase: 'result', result: r };
  if (game.penalty && game.on) {
    const best = { ...game.best };
    if (r && (best[pid] == null || r.total > best[pid])) best[pid] = r.total;
    patch.best = best;
    if (r && r.total >= PASS) patch.scores = { ...game.scores, [pid]: (game.scores[pid] || 0) + 1 };
  }
  set(patch);
  if (game.penalty && game.on) later(() => { set({ turnNo: game.turnNo + 1 }); nextTurn(); }, RESULT_MS);
  else later(() => { if (game.phase === 'result') set({ phase: 'lobby', result: null }); }, FREE_RESULT_MS);
}

function closing() {
  clearInterval(tick); stopWheel();
  const s = pickSong();
  set({ phase: 'closing', on: false, songTitle: s ? s.title : '' });
  if (s) playSong(s); else later(showScores, 4000);
}

function showScores() {
  stopVideo();
  clearTimeout(timer);
  set({ phase: 'scores', on: false });
}

function toLobby() {
  clearInterval(tick); clearTimeout(timer); stopVideo(); stopWheel();
  set({ phase: 'lobby', on: false, result: null, q: null, reveal: null });
}

/* ---------- admin ---------- */
function checkAdmin() {
  if (!players.length) return;
  const first = players.slice().sort((x, y) => x.at - y.at)[0];
  /* until the admin has done anything, the admin is whoever scanned first
     (phones connect at different speeds, so the first one online may not be the first scan) */
  if (!adminUsed && !game.on && first.id !== game.admin) { set({ admin: first.id }); return; }
  if (present(game.admin)) { adminGoneAt = 0; return; }
  if (!game.admin) { set({ admin: first.id }); return; }
  if (!adminGoneAt) adminGoneAt = Date.now();
  else if (Date.now() - adminGoneAt > ADMIN_GRACE_MS) { adminGoneAt = 0; set({ admin: first.id }); }
}

function onCmd(p) {
  if (!p || p.by !== game.admin) return;
  adminUsed = true;
  switch (p.action) {
  case 'game':                                  /* start the quiz */
    if (game.on || game.phase === 'song') return;
    startGame(+p.turns, +p.cut, +p.secs);
    break;
  case 'start': {                               /* free song, outside the quiz */
    const t = players.find(x => x.id === p.target);
    if (!t || game.on || game.phase === 'song') return;
    live = {};
    set({ phase: 'song', song: game.song + 1, singer: t.id, singerName: t.name, dur: +p.dur || 0, result: null, penalty: false, songTitle: '' });
    break;
  }
  case 'stop':
    if (game.phase === 'song') endSong();
    else if (game.phase === 'closing') showScores();
    break;
  case 'end':                                   /* end the game: closing song, then scores */
    if (!game.on) return;
    clearTimeout(timer); stopVideo();
    if (game.phase === 'song') send('stop', { song: game.song });
    closing();
    break;
  case 'approve': {
    const t = players.find(x => x.id === p.target);
    if (!game.on || !t || game.order.indexOf(t.id) >= 0) return;
    set({ order: game.order.concat(t.id), names: { ...game.names, [t.id]: t.name }, scores: { ...game.scores, [t.id]: 0 } });
    refreshPending();
    break;
  }
  case 'reject':
    if (!game.on || (game.rejected || []).indexOf(p.target) >= 0) return;
    set({ rejected: (game.rejected || []).concat(p.target) });
    refreshPending();
    break;
  case 'lobby':
    if (game.phase === 'song') send('stop', { song: game.song });
    toLobby();
    break;
  }
}

/* players who joined after the start wait for the admin */
function refreshPending() {
  if (!game.on) { if ((game.pending || []).length) set({ pending: [] }); return; }
  const pend = players.filter(p => game.order.indexOf(p.id) < 0 && (game.rejected || []).indexOf(p.id) < 0)
    .map(p => ({ id: p.id, name: p.name }));
  if (JSON.stringify(pend) !== JSON.stringify(game.pending || [])) set({ pending: pend });
}

function onAnswer(p) {
  if (!p || game.phase !== 'question' || !game.q || p.by !== game.q.by || p.n !== game.q.n) return;
  judge(+p.idx);
}

/* ---------- rendering ---------- */
function show(id, on) { $(id).classList.toggle('hidden', !on); }

function drawQr(el) {
  try {
    const q = qrcode(0, 'M'); q.addData(joinUrl); q.make();
    el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2 });
  } catch (e) { el.textContent = joinUrl; }
}

function drawBar(scope, m, a) {
  const fill = scope.querySelector('.bM'), aud = scope.querySelector('.bA');
  if (a >= 0) {
    fill.style.width = m + '%';
    aud.className = 'bA pos'; aud.style.right = m + '%'; aud.style.width = Math.min(a, 100 - m) + '%';
  } else {
    const keep = Math.max(0, m + a);
    fill.style.width = keep + '%';
    aud.className = 'bA neg'; aud.style.right = keep + '%'; aud.style.width = (m - keep) + '%';
  }
}

function drawVBar(scope, m, a) {
  const fill = scope.querySelector('.vM'), aud = scope.querySelector('.vA');
  if (a >= 0) {
    fill.style.height = m + '%';
    aud.className = 'vA pos'; aud.style.bottom = m + '%'; aud.style.height = Math.min(a, 100 - m) + '%';
  } else {
    const keep = Math.max(0, m + a);
    fill.style.height = keep + '%';
    aud.className = 'vA neg'; aud.style.bottom = keep + '%'; aud.style.height = (m - keep) + '%';
  }
}

function scoreRows() {
  return game.order.map(id => ({ id, name: game.names[id] || nameOf(id), s: game.scores[id] || 0 }))
    .sort((x, y) => y.s - x.s);
}

function render() {
  const ph = game.phase;
  const clear = videoOn && (ph === 'song' || ph === 'closing');
  document.body.classList.toggle('clear', clear);
  if (clear !== lastClear) { lastClear = clear; toApp({ kq: 'clear', on: clear }); }
  show('lobby', ph === 'lobby');
  show('question', ph === 'question' || ph === 'reveal');
  show('wheelScr', ph === 'wheel');
  show('song', ph === 'song');
  show('result', ph === 'result');
  show('closing', ph === 'closing');
  show('scores', ph === 'scores');
  show('strip', videoOn && ph === 'song');
  show('corner', ph !== 'lobby');

  $('chips').innerHTML = '';
  for (const p of players) {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = (p.id === game.admin ? '👑 ' : '') + p.name;
    $('chips').append(c);
  }
  const an = nameOf(game.admin);
  $('adminLine').textContent = !players.length ? 'מחכים לשחקנים…' :
    an ? '👑 ' + an + ' מתחיל/ה את המשחק מהטלפון (⚙️ ניהול)' : '';
  $('mini').textContent = game.on
    ? scoreRows().map(r => '\u2068' + r.name + ' ' + ltr(r.s) + '\u2069').join(' · ') + `   ·   תור ${Math.min(game.turnNo + 1, game.turns)}/${game.turns}`
    + ((game.pending || []).length ? '   ·   ⏳ ממתינים לאישור: ' + game.pending.map(x => x.name).join(', ') : '')
    : '';

  if ((ph === 'question' || ph === 'reveal') && game.q) {
    const q = game.q, rv = game.reveal;
    $('qHead').textContent = '🎯 התור של ' + q.byName;
    $('qText').textContent = q.text;
    $('qAns').innerHTML = '';
    q.answers.forEach((t, i) => {
      const d = document.createElement('div');
      d.className = 'ans' + (rv ? (i === rv.correct ? ' good' : i === rv.chosen ? ' bad' : '') : '');
      d.innerHTML = '<b>' + 'אבגד'[i] + '</b>';
      d.append(document.createTextNode(t));
      $('qAns').append(d);
    });
    $('qTimer').textContent = rv ? '' : q.left;
    $('qTimer').classList.toggle('low', !rv && q.left <= 5);
    $('verdict').textContent = !rv ? '' : rv.ok ? '✅ נכון! ' + signed(1) :
      (rv.chosen < 0 ? '⏰ נגמר הזמן! ' : '❌ טעות! ') + signed(-1) + ' · עכשיו ' + q.byName + ' שר/ה!';
  }

  if (ph === 'wheel') $('wheelCap').textContent = game.songTitle ? '🎵 ' + game.songTitle : '🎡 מגרילים שיר ל' + game.singerName + '…';

  if (ph === 'song') {
    const on = live.song === game.song;
    const m = on ? (live.meter || 0) : 0, a = on ? (live.aud || 0) : 0, total = on ? (live.total || 0) : 0;
    $('singer').textContent = '🎤 ' + game.singerName + ' שר/ה' + (game.songTitle ? ' · ' + game.songTitle : '');
    drawBar($('song'), m, a);
    drawVBar($('strip'), m, a);
    $('num').textContent = total; $('sNum').textContent = total;
    $('num').style.color = $('sNum').style.color = total >= PASS ? 'var(--ok)' : '';
    $('sName').textContent = '🎤\n' + game.singerName;
    const v = on ? `👍 ${live.up || 0}  👎 ${live.down || 0}` : '';
    $('votes').textContent = v;
    $('sVotes').textContent = on ? `👍 ${live.up || 0}\n👎 ${live.down || 0}` : '';
    const st = on ? live.stage : '';
    $('songStatus').textContent = st === 'sing' ? (game.songTitle ? 'הצביעו בטלפון!' : 'שירו שיר לבחירתכם · הצביעו בטלפון!') :
      st === 'cal' || st === 'count' ? 'מתכוננים…' : st === 'done' ? 'מחשבים…' : 'מחכים למיקרופון של ' + game.singerName + '…';
  }

  if (ph === 'result') {
    const r = game.result;
    $('rName').textContent = '🎤 ' + game.singerName;
    if (r) {
      $('rScore').textContent = r.total;
      $('rScore').style.color = r.total >= PASS ? 'var(--ok)' : 'var(--acc)';
      $('rVerdict').textContent = r.total >= PASS ? '⭐ הנקודה ניצלה! ' + signed(1) : '🙈 הנקודה לא ניצלה';
      $('rSplit').textContent = `שירה ${Math.round(r.meter * METER_W)} · קהל ${signed(Math.round(r.aud))} (👍 ${r.up} 👎 ${r.down})`;
    } else {
      $('rScore').textContent = '—';
      $('rScore').style.color = 'var(--mut)';
      $('rVerdict').textContent = 'לא התקבלה מדידה מהטלפון';
      $('rSplit').textContent = '';
    }
  }

  if (ph === 'scores') {
    const rows = scoreRows();
    $('board').innerHTML = '';
    rows.forEach((r, i) => {
      const d = document.createElement('div');
      d.className = 'row';
      d.textContent = (i === 0 ? '👑 ' : (i + 1) + '. ') + r.name;
      const s = document.createElement('b'); s.textContent = ltr(r.s);
      d.append(s);
      $('board').append(d);
    });
    const king = rows[0];
    let star = null;
    Object.keys(game.best).forEach(id => { if (!star || game.best[id] > star.v) star = { id, v: game.best[id] }; });
    $('titles').innerHTML = '';
    const lines = [];
    if (king) lines.push('👑 מלך/ת החידון: ' + king.name);
    if (star) lines.push('⭐ כוכב/ת הערב: ' + (game.names[star.id] || nameOf(star.id)) + ' (' + star.v + ')');
    lines.forEach(t => { const d = document.createElement('div'); d.textContent = t; $('titles').append(d); });
  }
}

/* ---------- realtime ---------- */
function connect() {
  const c = sb.channel('karoque-game-' + room, { config: { presence: { key: 'tv' } } });
  chan = c;
  c.on('presence', { event: 'sync' }, () => {
      players = Object.entries(c.presenceState()).filter(([id]) => id !== 'tv')
        .map(([id, arr]) => ({ id, name: (arr[0] && arr[0].name) || '?', at: (arr[0] && arr[0].at) || 0 }));
      checkAdmin();
      refreshPending();
      render();
    })
    .on('broadcast', { event: 'cmd' }, ({ payload }) => onCmd(payload))
    .on('broadcast', { event: 'answer' }, ({ payload }) => onAnswer(payload))
    .on('broadcast', { event: 'result' }, ({ payload }) => onResult(payload))
    .on('broadcast', { event: 'live' }, ({ payload }) => { if (payload.song === game.song) { live = payload; render(); } })
    .on('broadcast', { event: 'hello' }, () => send('game', game))
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        await c.track({ tv: true });
        $('conn').textContent = '';
        send('game', game);
      } else if ((status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') && chan === c) {
        $('conn').textContent = 'מתחבר מחדש…';
        chan = null;
        sb.removeChannel(c);
        setTimeout(connect, 3000);
      }
    });
}

$$('.roomCode').forEach(el => { el.textContent = room; });
drawQr($('qrBig'));
drawQr($('qrSmall'));
loadBank();
toApp({ kq: 'hello' });
if (inApp) {
  diag('start, base ' + base);
  usbScan();
  setInterval(usbScan, 30000);
  try { tizen.filesystem.addStorageStateChangeListener(() => setTimeout(usbScan, 2000)); } catch (e) { /* older API */ }
  const v = $('kqv');
  v.addEventListener('ended', () => { stopVideo(); onVideoEnded(); });
  v.addEventListener('error', () => { stopVideo(); onVideoEnded(); });
  try { tizen.tvinputdevice.registerKey('ColorF1Green'); } catch (e) { /* not a TV */ }
  /* BACK or green: back to the regular karaoke app */
  document.addEventListener('keydown', e => {
    if (e.keyCode !== 10009 && e.keyCode !== 404) return;
    e.preventDefault();
    stopVideo();
    ls.set('kq_mode', 'karaoke');
    try { sessionStorage.setItem('kq_back', '1'); } catch (err) { /* private mode */ }
    let home = '';
    try { home = sessionStorage.getItem('kq_home') || ''; } catch (err) { home = ''; }
    if (home) location.href = home;
  });
}
setInterval(() => { send('game', game); checkAdmin(); }, 5000);   /* heartbeat + admin hand-over */
if (window.supabase) {
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  connect();
} else {
  $('conn').textContent = 'ספריית Supabase לא נטענה';
}
render();
</script>
