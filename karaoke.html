<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karaoke">
<title>Karaoke Cloud Remote</title>
<style>
:root { color-scheme:dark; font-family:system-ui,Arial; }
/* Disable iOS double-tap zoom so repeated button taps don't resize the page. */
html, button { touch-action:manipulation; }
body { background:#111827;color:#f9fafb;margin:auto;max-width:680px;padding:18px }
h1 { margin:12px 0 5px }
p { line-height:1.4 }
section { background:#1f2937;padding:14px;margin:14px 0;border-radius:14px }
input,button {
  box-sizing:border-box;border:1px solid #566378;border-radius:9px;
  padding:13px;font-size:17px;background:#111827;color:white;min-height:46px
}
input { width:100%;margin:6px 0 }
button { background:#374151;margin:4px }
button.main { background:#126d52 }
button:disabled { opacity:.45 }
.row { display:flex;gap:5px;flex-wrap:wrap }
.row>* { flex:1 }
#message { color:#a7f3d0;min-height:3em;white-space:pre-wrap }
#nowPlaying { font-size:18px;font-weight:bold;color:#fde68a;overflow-wrap:anywhere }
.song {
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;border-top:1px solid #455166;padding:8px 0
}
.song span { overflow-wrap:anywhere;flex:1 }
.result {
  display:flex;gap:10px;align-items:center;
  border-top:1px solid #455166;padding:10px 0
}
.result img { width:110px;height:62px;object-fit:cover;border-radius:8px }
.result-info { min-width:0;flex:1 }
.result-title { font-weight:bold;overflow-wrap:anywhere }
.result-actions { display:flex;gap:4px;flex-wrap:wrap }
.result-actions button { font-size:14px;padding:8px;min-height:38px }
a { color:#93c5fd }
small { color:#cbd5e1 }
</style>
</head>
<body>

<h1>🎤 Karaoke Cloud</h1>
<p>שליטה בטלוויזיה דרך Supabase — בלי שרת Ubuntu</p>

<section id="loginPanel">
  <h2>כניסה</h2>
  <input id="email" type="email" autocomplete="email" placeholder="Email" dir="ltr">
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" dir="ltr">
  <button id="loginBtn" class="main">התחבר</button>
</section>

<section id="controls" hidden>
  <div id="nowPlaying">לא מתנגן כרגע</div>
  <div class="row">
    <button id="pauseBtn">⏸ השהה</button>
    <button id="resumeBtn">▶ המשך</button>
    <button id="nextBtn" class="main">⏭ הבא בתור</button>
  </div>
  <div class="row">
    <button id="skipAdBtn">⏩ דלג פרסומת <small>(טוען את השיר מחדש)</small></button>
  </div>

  <h2>חיפוש שירים ב־YouTube</h2>
  <div class="row">
    <input id="searchInput" placeholder="שם שיר, זמר או karaoke" aria-label="חיפוש YouTube">
    <button id="searchBtn" class="main">🔎 חפש</button>
  </div>
  <div id="searchStatus" role="status" aria-live="polite"></div>
  <div id="searchResults"></div>

  <h2>ניגון שיר מקישור</h2>
  <input id="videoInput" dir="ltr" placeholder="קישור YouTube או מזהה סרטון בן 11 תווים">
  <input id="titleInput" placeholder="שם השיר (לא חובה)">
  <div class="row">
    <button id="playBtn" class="main">▶ נגן עכשיו</button>
    <button id="addBtn">+ הוסף לתור</button>
  </div>
  <small>אפשר גם להדביק כאן קישור YouTube מלא.</small>

  <h2>תור שירים בענן <small>(ממשיך גם כשהאייפון נעול)</small></h2>
  <div id="queue">טוען...</div>
  <div class="row">
    <button id="refreshBtn">↻ רענן</button>
    <button id="clearBtn">נקה תור</button>
  </div>

  <h2>צימוד טלוויזיה</h2>
  <input id="pairCode" maxlength="10" placeholder="קוד שמופיע בטלוויזיה" dir="ltr">
  <button id="pairBtn">אשר טלוויזיה</button>

  <div class="row"><button id="logoutBtn">התנתק</button></div>
</section>

<p id="message" role="status" aria-live="polite">טוען...</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

var SUPABASE_URL = 'https://vifemcedezouvuayplun.supabase.co';
var KEY = 'sb_publishable_QN23d4WZsTSTAsiB-lWCDQ_9Y1DBFdT';
var REFRESH_MS = 5000;
var $ = function(id){ return document.getElementById(id); };

var client;
var queue = [];
var refreshTimer = null;

function say(s) {
  $('message').textContent = s;
}

/* ---------------- Edge Function calls ---------------- */

async function invoke(name, body) {
  var sess = await client.auth.getSession();
  if (!sess.data.session) {
    showAuth(false);
    throw Error('יש להתחבר שוב');
  }

  var result = await client.functions.invoke(name, { body:body });
  if (result.error) {
    var detail = result.error.message;
    if (result.error.context && typeof result.error.context.json === 'function') {
      try {
        var b = await result.error.context.json();
        detail = b.error || detail;
      } catch(e) {}
    }
    throw Error(detail);
  }
  return result.data;
}

function queueCall(action, payload) {
  return invoke('karaoke-queue', Object.assign({ action:action }, payload || {}));
}

// Pause / resume go directly to the TV through karaoke-pairing.
async function command(cmd) {
  try {
    say('שולח לטלוויזיה...');
    var r = await invoke('karaoke-pairing', { action:'send', command:cmd });
    if (!r || r.status !== 'QUEUED') throw Error('תשובה לא צפויה');
    say('נשלח לטלוויזיה. Command #' + r.command_id);
  } catch(e) {
    say('שגיאה: ' + e.message);
  }
}

/* ---------------- Queue ---------------- */

async function refreshQueue() {
  var result = await queueCall('list');
  queue = Array.isArray(result.songs) ? result.songs : [];
  renderQueue();
}

function renderQueue() {
  var el = $('queue');
  el.textContent = '';

  var playing = queue.filter(function(s){ return s.status === 'playing'; })[0];
  $('nowPlaying').textContent = playing ? ('▶ מתנגן: ' + playing.title) : 'לא מתנגן כרגע';

  var pending = queue.filter(function(s){ return s.status === 'pending'; });
  if (!pending.length) {
    el.textContent = 'התור ריק';
    return;
  }

  pending.forEach(function(song, i) {
    var row = document.createElement('div');
    row.className = 'song';

    var txt = document.createElement('span');
    txt.textContent = (i+1) + '. ' + song.title;

    var b = document.createElement('button');
    b.textContent = 'הסר';
    b.onclick = async function() {
      try {
        await queueCall('remove', { queue_id:song.id });
        await refreshQueue();
      } catch(e) {
        say('שגיאה: ' + e.message);
      }
    };

    row.appendChild(txt);
    row.appendChild(b);
    el.appendChild(row);
  });
}

async function addToQueue(song) {
  try {
    say('מוסיף לתור...');
    var r = await queueCall('add', { video_id:song.id, title:song.title });
    await refreshQueue();
    say(r.started ? ('מתחיל לנגן: ' + song.title) : ('נוסף לתור: ' + song.title));
  } catch(e) {
    say(e.message === 'QUEUE_FULL' ? 'התור מלא (100 שירים)' : 'שגיאת תור: ' + e.message);
  }
}

async function playNow(song) {
  try {
    say('מפעיל בטלוויזיה...');
    await queueCall('play_now', { video_id:song.id, title:song.title });
    await refreshQueue();
    say('מנגן: ' + song.title);
  } catch(e) {
    say('שגיאה: ' + e.message);
  }
}

function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(function() {
    if (document.visibilityState === 'visible') {
      refreshQueue().catch(function(){});
    }
  }, REFRESH_MS);
}

function stopAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
}

/* ---------------- Input helpers ---------------- */

function videoId(v) {
  v = (v || '').trim();

  if (/^[\w-]{11}$/.test(v)) return v;

  try {
    var u = new window.URL(v);

    if (u.hostname === 'youtu.be' || u.hostname === 'www.youtu.be') {
      v = u.pathname.split('/')[1];
    } else if ([
      'youtube.com',
      'www.youtube.com',
      'm.youtube.com',
      'music.youtube.com'
    ].includes(u.hostname)) {
      v = u.searchParams.get('v') ||
          ((u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)) || [])[1];
    } else {
      return null;
    }

    return /^[\w-]{11}$/.test(v || '') ? v : null;
  } catch(e) {
    return null;
  }
}

function currentSong() {
  var id = videoId($('videoInput').value);
  if (!id) {
    say('קישור YouTube לא תקין');
    return null;
  }
  return {
    id: id,
    title: $('titleInput').value.trim() || id
  };
}

/* ---------------- Auth ---------------- */

function showAuth(ok) {
  $('loginPanel').hidden = !!ok;
  $('controls').hidden = !ok;
  say(ok ? 'מחובר — מוכן לניגון' : 'יש להתחבר');
  if (ok) {
    refreshQueue().catch(function(e){ say('שגיאת תור: ' + e.message); });
    startAutoRefresh();
  } else {
    stopAutoRefresh();
  }
}

$('loginBtn').onclick = async function() {
  say('מתחבר...');
  try {
    var r = await client.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    $('password').value = '';
    if (r.error) throw r.error;
    showAuth(true);
  } catch(e) {
    say('שגיאת התחברות: ' + e.message);
  }
};

$('logoutBtn').onclick = async function() {
  await client.auth.signOut();
  showAuth(false);
};

/* ---------------- Search ---------------- */

function searchStatus(text) {
  $('searchStatus').textContent = text;
}

function renderResults(videos) {
  var box = $('searchResults');
  box.textContent = '';

  if (!videos.length) {
    searchStatus('לא נמצאו תוצאות');
    return;
  }

  videos.forEach(function(v) {
    if (!v || typeof v.id !== 'string' || !/^[A-Za-z0-9_-]{11}$/.test(v.id)) return;

    var song = { id: v.id, title: String(v.title || v.id) };

    var row = document.createElement('div');
    row.className = 'result';

    var img = document.createElement('img');
    img.src = 'https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg';
    img.alt = '';
    img.loading = 'lazy';

    var content = document.createElement('div');
    content.className = 'result-info';

    var title = document.createElement('div');
    title.className = 'result-title';
    title.textContent = song.title;

    var channel = document.createElement('small');
    channel.textContent = String(v.channel || '');

    var actions = document.createElement('div');
    actions.className = 'result-actions';

    var play = document.createElement('button');
    play.className = 'main';
    play.textContent = '▶ נגן עכשיו';
    play.onclick = function() { playNow(song); };

    var add = document.createElement('button');
    add.textContent = '+ הוסף לתור';
    add.onclick = function() { addToQueue(song); };

    actions.appendChild(play);
    actions.appendChild(add);
    content.appendChild(title);
    content.appendChild(channel);
    content.appendChild(actions);
    row.appendChild(img);
    row.appendChild(content);
    box.appendChild(row);
  });
}

async function searchVideos() {
  var query = $('searchInput').value.trim();

  if (query.length < 2 || query.length > 100) {
    searchStatus('הזן לפחות 2 ועד 100 תווים');
    return;
  }

  var button = $('searchBtn');
  button.disabled = true;
  searchStatus('מחפש ב־YouTube...');
  $('searchResults').textContent = '';

  try {
    var data = await invoke('bright-task', { query:query });
    if (!data || data.status !== 'OK' || !Array.isArray(data.videos)) {
      throw Error('תגובה לא תקינה משרת החיפוש');
    }
    searchStatus('נמצאו ' + data.videos.length +
                 ' תוצאות. ייתכן שסרטונים מסוימים אינם ניתנים להטמעה.');
    renderResults(data.videos);
  } catch(e) {
    searchStatus('שגיאת חיפוש: ' + e.message);
  } finally {
    button.disabled = false;
  }
}

$('searchBtn').onclick = searchVideos;
$('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    searchVideos();
  }
});

/* ---------------- Buttons ---------------- */

$('playBtn').onclick = function() {
  var s = currentSong();
  if (s) playNow(s);
};

$('addBtn').onclick = function() {
  var s = currentSong();
  if (s) addToQueue(s);
};

$('nextBtn').onclick = async function() {
  try {
    var r = await queueCall('next');
    await refreshQueue();
    say(r.next ? 'מנגן: ' + r.next.next_title : 'התור ריק');
  } catch(e) {
    say('שגיאה: ' + e.message);
  }
};

$('pauseBtn').onclick = function() { command('pause'); };
$('skipAdBtn').onclick = function() { command('skip'); };
$('resumeBtn').onclick = function() { command('resume'); };

$('refreshBtn').onclick = function() {
  refreshQueue().then(function(){ say('התור עודכן'); })
                .catch(function(e){ say('שגיאה: ' + e.message); });
};

$('clearBtn').onclick = async function() {
  if (!confirm('לנקות את התור בענן?')) return;
  try {
    await queueCall('clear');
    await refreshQueue();
    say('התור נוקה');
  } catch(e) {
    say('שגיאה: ' + e.message);
  }
};

$('pairBtn').onclick = async function() {
  var code = $('pairCode').value.trim().toUpperCase();
  if (!/^[A-F0-9]{10}$/.test(code)) {
    say('קוד צימוד לא תקין');
    return;
  }
  try {
    var r = await invoke('karaoke-pairing', { action:'approve', code:code });
    say('סטטוס צימוד: ' + r.status);
  } catch(e) {
    say('שגיאת צימוד: ' + e.message);
  }
};

/* ---------------- Start ---------------- */

renderQueue();

if (!window.supabase) {
  say('ספריית Supabase לא נטענה');
  return;
}

client = window.supabase.createClient(SUPABASE_URL, KEY);

client.auth.getSession()
  .then(function(r) { showAuth(!!(r.data && r.data.session)); })
  .catch(function(e) { say('שגיאת Session: ' + e.message); });

client.auth.onAuthStateChange(function(event) {
  if (event === 'SIGNED_OUT') showAuth(false);
});

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && !$('controls').hidden) {
    refreshQueue().catch(function(){});
  }
});

})();
</script>
</body>
</html>
