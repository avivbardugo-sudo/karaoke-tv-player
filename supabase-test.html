<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Cloud Login</title>
<style>
body { font-family: Arial; padding: 25px; text-align: center; }
input, button { display: block; width: 100%; box-sizing: border-box; padding: 15px; margin: 12px 0; font-size: 18px; }
</style>
</head>
<body>
<h2>Karaoke Cloud Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="login">Connect to Supabase</button>
<p id="status">Not connected</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const client = window.supabase.createClient(
  'https://vifemcedezouvuayplun.supabase.co',
  'sb_publishable_QN23d4WZsTSTAsiB-lWCDQ_9Y1DBFdT'
);

document.getElementById('login').onclick = async () => {
  const status = document.getElementById('status');
  status.textContent = 'Connecting...';

  const { data, error } = await client.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  document.getElementById('password').value = '';

  status.textContent = error
    ? 'Login failed: ' + error.message
    : 'AUTHORIZED - Supabase connected';
};
</script>

<!-- REALTIME TEST BUTTON -->
<button id="testRealtime">Test Realtime</button>
<p id="realtimeStatus">Realtime not tested</p>

<script>
document.getElementById('testRealtime').onclick = async () => {
  const output = document.getElementById('realtimeStatus');
  output.textContent = 'Connecting to Realtime...';

  const { data: { session } } = await client.auth.getSession();

  if (!session) {
    output.textContent = 'Please log in first';
    return;
  }

  const channel = client.channel('karaoke-tv-control', {
    config: { private: true }
  });

  // REALTIME RECEIVE TEST
  channel.on('broadcast', { event: 'karaoke_test' }, event => {
    output.textContent = 'RECEIVED: ' + event.payload.message;
  });

  channel.subscribe(async status => {
    if (status === 'SUBSCRIBED') {
      output.textContent = 'REALTIME CONNECTED';

      const result = await channel.send({
        type: 'broadcast',
        event: 'karaoke_test',
        payload: { message: 'HELLO_FROM_IPHONE' }
      });

      output.textContent = 'REALTIME SEND: ' + result;
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      output.textContent = 'REALTIME ERROR: ' + status;
    }
  });
};
</script>

<!-- PAIRING AUTH TEST -->
<button id="testPairingAuth">TEST PAIRING AUTH</button>
<p id="pairingAuthStatus">Not tested</p>

<script>
document.getElementById('testPairingAuth').onclick = async () => {
  const output = document.getElementById('pairingAuthStatus');
  output.textContent = 'Testing pairing authorization...';

  try {
    const { data: { session }, error: sessionError } =
      await client.auth.getSession();

    if (sessionError || !session) {
      output.textContent = 'Please log in first';
      return;
    }

    const { data, error } = await client.functions.invoke(
      'karaoke-pairing',
      { body: {} }
    );

    if (error) {
      output.textContent =
        'PAIRING AUTH ERROR: ' + error.message;
      return;
    }

    output.textContent =
      'PAIRING AUTH RESULT: ' + JSON.stringify(data);

  } catch (e) {
    output.textContent = 'ERROR: ' + e.message;
  }
};
</script>

<h3>Pair Samsung TV</h3>
<input id="pairingCode" placeholder="TV Pairing Code" maxlength="10" autocomplete="off">
<button id="approvePairing">APPROVE TV</button>
<p id="pairingStatus">Waiting for pairing</p>

<script>
document.getElementById('approvePairing').onclick = async function () {
  const output = document.getElementById('pairingStatus');
  const code = document.getElementById('pairingCode').value.trim().toUpperCase();

  if (!/^[0-9A-F]{10}$/.test(code)) {
    output.textContent = 'Invalid pairing code';
    return;
  }

  output.textContent = 'Approving TV...';

  try {
    const { data: { session }, error: authError } =
      await client.auth.getSession();

    if (authError || !session) {
      output.textContent = 'Please log in first';
      return;
    }

    const { data, error } = await client.functions.invoke(
      'karaoke-pairing',
      { body: { action: 'approve', code: code } }
    );

    output.textContent = error
      ? 'PAIRING ERROR: ' + error.message
      : 'PAIRING STATUS: ' + data.status;
  } catch (e) {
    output.textContent = 'PAIRING ERROR: ' + e.message;
  }
};
</script>


<h3>Cloud Player Test</h3>
<button id="cloudPlay">PLAY TEST VIDEO ON TV</button>
<p id="cloudPlayStatus">Ready</p>

<script>
document.getElementById('cloudPlay').onclick = async function() {
  const output = document.getElementById('cloudPlayStatus');
  output.textContent = 'Sending play command...';

  try {
    const { data: { session } } = await client.auth.getSession();

    if (!session) {
      output.textContent = 'Please log in first';
      return;
    }

    const { data, error } = await client.functions.invoke(
      'karaoke-pairing',
      {
        body: {
          action: 'send',
          command: 'play',
          video_id: 'M7lc1UVf-VE'
        }
      }
    );

    output.textContent = error
      ? 'PLAY ERROR: ' + error.message
      : 'PLAY RESULT: ' + JSON.stringify(data);

  } catch (e) {
    output.textContent = 'PLAY ERROR: ' + e.message;
  }
};
</script>

</body>


</html>
