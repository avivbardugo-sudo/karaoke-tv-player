<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAROQUE – בדיקת מיקרופון</title>
<style>
  :root { --bg:#0e0b1a; --card:#1b1630; --fg:#f4f1ff; --mut:#9a93b8; --acc:#ff3d8b; --ok:#3ddc84; --warn:#ffb020; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif; padding:16px; padding-bottom:40px; }
  h1 { font-size:22px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; }
  button { font:inherit; font-size:18px; border:0; border-radius:12px; padding:14px; width:100%; color:#fff; background:var(--acc); }
  button.sec { background:#3a3358; }
  button:disabled { opacity:.4; }
  select { font:inherit; font-size:16px; padding:8px; border-radius:8px; background:#2a2445; color:var(--fg); border:0; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .mut { color:var(--mut); font-size:14px; }
  #status { font-size:20px; text-align:center; min-height:28px; margin:6px 0; }
  .meter { height:18px; background:#2a2445; border-radius:9px; overflow:hidden; position:relative; }
  .meter > div { height:100%; width:0; background:linear-gradient(90deg,var(--ok),var(--warn),var(--acc)); transition:width .05s; }
  .meter .thr { position:absolute; top:0; bottom:0; width:2px; background:#fff; opacity:.7; }
  #note { font-size:44px; font-weight:700; text-align:center; letter-spacing:1px; min-height:56px; }
  #prog { height:10px; background:#2a2445; border-radius:5px; overflow:hidden; margin-top:8px; }
  #prog > div { height:100%; width:0; background:var(--acc); }
  canvas { width:100%; height:160px; display:block; background:#120e22; border-radius:10px; }
  #score { font-size:64px; font-weight:800; text-align:center; }
  .bar { margin:8px 0; }
  .bar .meter > div { transition:width .6s; }
  .hidden { display:none; }
  #verdict { text-align:center; font-size:20px; margin-top:4px; }
</style>
</head>
<body>
<h1>🎤 KAROQUE – בדיקת מד שירה</h1>

<div class="card" id="setup">
  <div class="row"><span>משך מדידה</span>
    <select id="dur"><option value="20">20 שנ׳</option><option value="45" selected>45 שנ׳</option><option value="90">90 שנ׳</option></select>
  </div>
  <p class="mut">שלבים: 3 שניות כיול רעש רקע (אפשר שהשיר כבר יתנגן בטלוויזיה, רק אל תשירו), ספירה לאחור ואז שרים. הטלפון ביד של השר, בגובה החזה.</p>
  <button id="go">🎤 התחל</button>
</div>

<div class="card hidden" id="live">
  <div id="status"></div>
  <div class="mut row"><span>עוצמה</span><span id="db">–</span></div>
  <div class="meter" id="lvl"><div></div><span class="thr"></span></div>
  <div id="note"></div>
  <canvas id="trail" width="600" height="320"></canvas>
  <div id="prog"><div></div></div>
  <div style="height:10px"></div>
  <button class="sec" id="stop">⏹ עצור</button>
</div>

<div class="card hidden" id="result">
  <div id="score">0</div>
  <div id="verdict"></div>
  <div class="bar"><div class="row"><span>🔊 עוצמה מעל הרקע</span><span id="vVol"></span></div><div class="meter"><div id="bVol"></div></div></div>
  <div class="bar"><div class="row"><span>〰️ רציפות</span><span id="vCon"></span></div><div class="meter"><div id="bCon"></div></div></div>
  <div class="bar"><div class="row"><span>🎯 יציבות צליל</span><span id="vSta"></span></div><div class="meter"><div id="bSta"></div></div></div>
  <p class="mut" id="dbg"></p>
  <button id="again">🔁 שוב</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NOTES = ['דו','דו#','רה','רה#','מי','פה','פה#','סול','סול#','לה','לה#','סי'];
const CAL_S = 3, COUNT_S = 3, DB_FLOOR = -70, DB_TOP = -10;

let ctx = null, stream = null, an = null, buf = null, raf = 0, wake = null;
let phase = 'idle', t0 = 0, durS = 45, calDb = [], baseDb = -55, thrDb = -49;
let frames = [], trail = [], lastTick = 0;

function rmsDb(b) {
  let s = 0;
  for (let i = 0; i < b.length; i++) s += b[i] * b[i];
  const r = Math.sqrt(s / b.length);
  return r > 0 ? Math.max(DB_FLOOR, 20 * Math.log10(r)) : DB_FLOOR;
}

/* YIN pitch detection, 80-1000 Hz. Returns Hz or -1. */
const D = new Float32Array(1024);
function yin(b, sr) {
  const minLag = Math.floor(sr / 1000), maxLag = Math.min(Math.floor(sr / 80), 1000);
  const W = b.length - maxLag;
  if (W < 256) return -1;
  for (let tau = 1; tau <= maxLag; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const d = b[i] - b[i + tau]; s += d * d; }
    D[tau] = s;
  }
  let run = 0;
  for (let tau = 1; tau <= maxLag; tau++) { run += D[tau]; D[tau] = run > 0 ? D[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = minLag; t < maxLag; t++) {
    if (D[t] < 0.15) { while (t + 1 < maxLag && D[t + 1] < D[t]) t++; tau = t; break; }
  }
  if (tau < 2) return -1;
  const a = D[tau - 1], c = D[tau], e = D[tau + 1], den = 2 * (2 * c - a - e);
  const bt = den !== 0 ? tau + (e - a) / den : tau;
  return sr / bt;
}

function midiOf(f) { return 69 + 12 * Math.log2(f / 440); }

async function start() {
  durS = +$('dur').value;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    alert('אין גישה למיקרופון: ' + (e && e.message ? e.message : e) +
      '\nבאייפון: הגדרות ← Safari ← מיקרופון ← לאפשר');
    cleanup();
    return;
  }
  const src = ctx.createMediaStreamSource(stream);
  an = ctx.createAnalyser();
  an.fftSize = 2048;
  src.connect(an);
  buf = new Float32Array(an.fftSize);
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }

  frames = []; trail = []; calDb = [];
  phase = 'cal'; t0 = performance.now(); lastTick = 0;
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('live').classList.remove('hidden');
  raf = requestAnimationFrame(loop);
}

function loop(now) {
  raf = requestAnimationFrame(loop);
  if (now - lastTick < 30) return;          /* ~30 analyses per second */
  lastTick = now;
  an.getFloatTimeDomainData(buf);
  const db = rmsDb(buf);
  const el = (now - t0) / 1000;
  const pct = v => Math.max(0, Math.min(100, (v - DB_FLOOR) / (DB_TOP - DB_FLOOR) * 100));
  $('lvl').firstElementChild.style.width = pct(db) + '%';
  $('lvl').querySelector('.thr').style.right = pct(thrDb) + '%';
  $('db').textContent = db.toFixed(0) + ' dB';

  if (phase === 'cal') {
    calDb.push(db);
    $('status').textContent = '🤫 מודדים רעש רקע… ' + Math.ceil(CAL_S - el);
    if (el >= CAL_S) {
      const s = calDb.slice().sort((a, b) => a - b);
      baseDb = s[Math.floor(s.length * 0.7)];
      thrDb = baseDb + 6;
      phase = 'count'; t0 = now;
    }
    return;
  }
  if (phase === 'count') {
    $('status').textContent = '🎶 מתחילים בעוד ' + Math.ceil(COUNT_S - el);
    if (el >= COUNT_S) { phase = 'sing'; t0 = now; }
    return;
  }
  if (phase !== 'sing') return;

  const f = db > thrDb ? yin(buf, ctx.sampleRate) : -1;
  const voiced = f > 0;
  const m = voiced ? midiOf(f) : null;
  frames.push({ t: el, db, voiced, m });
  trail.push({ t: el, m, v: db > thrDb });
  while (trail.length && el - trail[0].t > 6) trail.shift();

  $('status').textContent = voiced ? '🎤 שר!' : (db > thrDb ? '🔊 קול בלי צליל ברור' : '…');
  if (voiced) {
    const r = Math.round(m), oct = Math.floor(r / 12) - 1;
    const cents = Math.round((m - r) * 100);
    $('note').textContent = NOTES[((r % 12) + 12) % 12] + oct + ' ' + (cents >= 0 ? '+' : '') + cents;
  }
  $('prog').firstElementChild.style.width = Math.min(100, el / durS * 100) + '%';
  drawTrail(el);
  if (el >= durS) finish();
}

function drawTrail(now) {
  const c = $('trail'), g = c.getContext('2d'), W = c.width, H = c.height;
  const lo = 40, hi = 84;                    /* E2..C6 */
  g.clearRect(0, 0, W, H);
  g.strokeStyle = '#2a2445'; g.lineWidth = 1;
  for (let n = lo; n <= hi; n += 12) {
    const y = H - (n - lo) / (hi - lo) * H;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  for (const p of trail) {
    const x = W - (now - p.t) / 6 * W;
    if (p.m == null) {
      if (p.v) { g.fillStyle = '#5a5378'; g.fillRect(x, H - 6, 3, 6); }
      continue;
    }
    const y = H - (p.m - lo) / (hi - lo) * H;
    g.fillStyle = '#ff3d8b';
    g.beginPath(); g.arc(x, y, 3.5, 0, 6.3); g.fill();
  }
}

function clamp01(x) { return Math.max(0, Math.min(1, x)); }

function score() {
  const v = frames.filter(f => f.voiced);
  const total = frames.length || 1;
  /* volume: mean dB above background of voiced frames, 3 dB -> 0, 15 dB -> 100 */
  const above = v.length ? v.reduce((s, f) => s + (f.db - baseDb), 0) / v.length : 0;
  const vol = clamp01((above - 3) / 12) * 100;
  /* continuity: share of seconds that are >=40% voiced */
  const secs = Math.max(1, Math.ceil(frames[frames.length - 1]?.t || 1));
  const per = Array.from({ length: secs }, () => [0, 0]);
  for (const f of frames) { const i = Math.min(secs - 1, Math.floor(f.t)); per[i][1]++; if (f.voiced) per[i][0]++; }
  const good = per.filter(p => p[1] && p[0] / p[1] >= 0.4).length;
  const con = good / secs * 100;
  /* stability: median frame-to-frame pitch change inside a note (<100 cents), 8 c -> 100, 45 c -> 0 */
  const jit = [];
  for (let i = 1; i < frames.length; i++) {
    const a = frames[i - 1], b = frames[i];
    if (a.voiced && b.voiced) { const d = Math.abs(b.m - a.m) * 100; if (d < 100) jit.push(d); }
  }
  jit.sort((a, b) => a - b);
  const med = jit.length ? jit[Math.floor(jit.length / 2)] : 45;
  const sta = clamp01((45 - med) / 37) * 100;
  const tot = Math.round(0.3 * vol + 0.35 * con + 0.35 * sta);
  return { vol, con, sta, tot, above, med, voicedPct: v.length / total * 100 };
}

function finish() {
  if (phase !== 'sing') return;
  phase = 'done';
  const s = score();
  cleanup();
  $('live').classList.add('hidden'); $('result').classList.remove('hidden');
  $('score').textContent = s.tot;
  $('verdict').textContent = s.tot > 80 ? '⭐ מעל 80 – הנקודה חוזרת!' : s.tot >= 60 ? '👏 לא רע בכלל' : '🙈 אפשר יותר';
  const set = (k, v) => { $('v' + k).textContent = Math.round(v); $('b' + k).style.width = v + '%'; };
  set('Vol', 0); set('Con', 0); set('Sta', 0);
  setTimeout(() => { set('Vol', s.vol); set('Con', s.con); set('Sta', s.sta); }, 50);
  $('dbg').textContent = `רקע ${baseDb.toFixed(0)} dB · מעל הרקע ${s.above.toFixed(1)} dB · ` +
    `זמן עם צליל ${s.voicedPct.toFixed(0)}% · רעד חציוני ${s.med.toFixed(0)} סנט · ${frames.length} דגימות · ${ctx ? '' : ''}`;
}

function cleanup() {
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close().catch(() => {});
  if (wake) wake.release().catch(() => {});
  stream = null; ctx = null; an = null; wake = null;
}

$('go').onclick = start;
$('stop').onclick = () => {
  if (phase === 'sing' && frames.length > 30) finish();
  else { phase = 'idle'; cleanup(); $('live').classList.add('hidden'); $('setup').classList.remove('hidden'); }
};
$('again').onclick = () => { $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); };
</script>
</body>
</html>
