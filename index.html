<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke YouTube Player</title>
<style>
html, body, #player {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
</style>
</head>
<body>

<div id="player"></div>

<script>
'use strict';

// Embedded by the Samsung Tizen app (origin file://).
// Parent -> player: load_youtube{videoId}, pause, resume, toggle, seek{seconds}, restart, reload,
//                   mute, unmute
// Player -> parent: karaoke_ready, karaoke_state{state,videoId}, karaoke_ended{videoId},
//                   karaoke_error{code,videoId}, karaoke_ad{active,reason,videoId}
// Uses youtube.com so a signed-in YouTube Premium account applies (no ads);
// ?nocookie=1 switches to youtube-nocookie.com (privacy-enhanced, ignores the account).

const VIDEO_RE = /^[A-Za-z0-9_-]{11}$/;
const STATE_NAMES = { '-1': 'unstarted', 0: 'ended', 1: 'playing', 2: 'paused', 3: 'buffering', 5: 'cued' };
const useNoCookie = new URLSearchParams(location.search).get('nocookie') === '1';

let player = null;
let ready = false;
let currentVideoId = null;
let pending = [];
let startRetries = 0;
const MAX_START_RETRIES = 3;

function toParent(msg) {
    // The parent is a file:// document, which cannot be named as a target origin.
    window.parent.postMessage(msg, '*');
}

function state() {
    return player && typeof player.getPlayerState === 'function' ? player.getPlayerState() : -1;
}

function reportState() {
    toParent({ type: 'karaoke_state', state: STATE_NAMES[state()] || String(state()), videoId: currentVideoId });
}

// Ask YouTube to pause; if it is still playing shortly after, ask again once.
function pauseReliably() {
    player.pauseVideo();
    setTimeout(function() {
        if (state() === YT.PlayerState.PLAYING || state() === YT.PlayerState.BUFFERING) {
            player.pauseVideo();
        }
        reportState();
    }, 700);
}

function handle(msg) {
    switch (msg.type) {
    case 'load_youtube':
        if (typeof msg.videoId !== 'string' || !VIDEO_RE.test(msg.videoId)) return;
        currentVideoId = msg.videoId;
        startRetries = 0;
        resetAdDetector();
        player.loadVideoById(msg.videoId);
        return;
    case 'mute':
        player.mute();
        return;
    case 'unmute':
        player.unMute();
        player.setVolume(100);
        return;
    case 'pause':
        pauseReliably();
        return;
    case 'resume':
        player.playVideo();
        return;
    case 'toggle':
        // First OK after a muted autoplay restores the sound instead of pausing.
        if (player.isMuted() && state() === YT.PlayerState.PLAYING) {
            player.unMute();
            player.setVolume(100);
            toParent({ type: 'karaoke_unmuted' });
            return;
        }
        if (state() === YT.PlayerState.PLAYING || state() === YT.PlayerState.BUFFERING) {
            pauseReliably();
        } else {
            player.playVideo();
        }
        return;
    case 'seek': {
        const delta = Number(msg.seconds);
        if (!Number.isFinite(delta)) return;
        const target = Math.max(0, (player.getCurrentTime() || 0) + delta);
        player.seekTo(target, true);
        return;
    }
    case 'reload':
        // "Skip ad" experiment: reload the song from the start; YouTube often
        // does not serve the pre-roll ad again on an immediate reload.
        if (!currentVideoId) return;
        startRetries = 0;
        player.loadVideoById(currentVideoId, 0);
        return;
    case 'restart':
        player.seekTo(0, true);
        player.playVideo();
        return;
    case 'command':
        // Compatibility with the older command format.
        if (msg.action === 'play' || msg.action === 'resume') player.playVideo();
        if (msg.action === 'pause') pauseReliably();
        return;
    case 'get_state':
        reportState();
        return;
    }
}

function onYouTubeIframeAPIReady() {
    const options = {
        width: '100%',
        height: '100%',
        playerVars: {
            autoplay: 1,
            playsinline: 1,
            controls: 1,
            rel: 0,
            iv_load_policy: 3,
            fs: 0
        },
        events: {
            onReady: function() {
                ready = true;
                toParent({ type: 'karaoke_ready' });
                // Commands that arrived before the player was ready.
                const queued = pending;
                pending = [];
                queued.forEach(handle);
            },
            onStateChange: function(e) {
                reportState();
                // Autoplay blocked: the video stays "cued". Ask to play a few
                // times, then fall back to muted playback (always allowed).
                if (e.data === YT.PlayerState.CUED && currentVideoId) {
                    startRetries++;
                    if (startRetries <= MAX_START_RETRIES) {
                        player.playVideo();
                    } else if (startRetries === MAX_START_RETRIES + 1) {
                        player.mute();
                        player.playVideo();
                        toParent({ type: 'karaoke_muted_autoplay' });
                    }
                }
                if (e.data === YT.PlayerState.ENDED && currentVideoId) {
                    resetAdDetector();
                    const finished = currentVideoId;
                    currentVideoId = null;
                    toParent({ type: 'karaoke_ended', videoId: finished });
                }
            },
            onError: function(e) {
                // 2 invalid id, 5 HTML5 error, 100 not found, 101/150 embedding disabled.
                toParent({ type: 'karaoke_error', code: e.data, videoId: currentVideoId });
            }
        }
    };
    if (useNoCookie) options.host = 'https://www.youtube-nocookie.com';
    player = new YT.Player('player', options);
}

// Ad detection. The IFrame API has no ad events, so use what an ad looks like
// from outside: the player reports another video, or it says "playing" while
// the song's own clock does not move (pre-roll and mid-roll ads).
let adActive = false;
let lastTime = -1;
let frozenTicks = 0;

function setAd(active, reason) {
    if (active === adActive) return;
    adActive = active;
    toParent({ type: 'karaoke_ad', active: active, reason: reason, videoId: currentVideoId });
}

function resetAdDetector() {
    lastTime = -1;
    frozenTicks = 0;
    setAd(false, 'new-video');
}

setInterval(function() {
    if (!ready || !currentVideoId) return;
    let data = null;
    try { data = player.getVideoData(); } catch (e) {}
    if (data && data.video_id && data.video_id !== currentVideoId) {
        setAd(true, 'other-video');
        return;
    }
    if (state() !== YT.PlayerState.PLAYING) {
        // Paused/buffering: keep the last verdict.
        frozenTicks = 0;
        return;
    }
    const t = player.getCurrentTime() || 0;
    if (Math.abs(t - lastTime) < 0.05) {
        frozenTicks++;
        if (frozenTicks >= 2) setAd(true, 'clock-frozen');
    } else {
        frozenTicks = 0;
        setAd(false, 'clock-moves');
    }
    lastTime = t;
}, 1000);

// Accept commands only from the Samsung app embedding this page.
window.addEventListener('message', function(event) {
    if (event.source !== window.parent) return;
    if (event.origin !== 'file://') return;

    const msg = event.data;
    if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return;

    if (!ready) {
        // Keep only the latest load plus later controls; drop the rest.
        if (msg.type === 'load_youtube') pending = [];
        pending.push(msg);
        return;
    }
    handle(msg);
});

const script = document.createElement('script');
script.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(script);
</script>

</body>
</html>
