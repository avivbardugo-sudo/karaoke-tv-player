
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke YouTube Player</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
#player {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="player"></div>

<script>
'use strict';

let player = null;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        playerVars: {
            playsinline: 1,
            controls: 1
        },
        events: {
            onReady: function() {
                console.log('YouTube player ready');
            },
            onError: function(event) {
                console.error('YouTube error:', event.data);
            }
        }
    });
}

// Accept commands only from the Samsung app embedding this page.
window.addEventListener('message', function(event) {
    if (event.source !== window.parent) return;
    if (event.origin !== 'file://') return;

    const msg = event.data;

    if (!msg || typeof msg !== 'object') return;
    if (!player || typeof player.loadVideoById !== 'function') return;

    // Play a selected YouTube video.
    if (
        msg.type === 'load_youtube' &&
        typeof msg.videoId === 'string' &&
        /^[A-Za-z0-9_-]{11}$/.test(msg.videoId)
    ) {
        player.loadVideoById(msg.videoId);
        return;
    }

    // Pause video.
    if (msg.type === 'pause') {
        player.pauseVideo();
        return;
    }

    // Resume video.
    if (msg.type === 'resume') {
        player.playVideo();
        return;
    }

    // Compatibility with the older command format.
    if (msg.type === 'command') {
        if (msg.action === 'play' || msg.action === 'resume') {
            player.playVideo();
        } else if (msg.action === 'pause') {
            player.pauseVideo();
        }
    }
});

const script = document.createElement('script');
script.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(script);
</script>

</body>
</html>
